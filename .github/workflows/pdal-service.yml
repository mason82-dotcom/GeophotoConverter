name: PDAL Service

on:
  pull_request:
    paths:
      - "workers/pdal/**"
      - "backend/app/photogrammetry_pointcloud.py"
      - "backend/app/photogrammetry_pdal_pipeline.py"
      - "backend/app/photogrammetry_pdal_ground.py"
      - "backend/app/pointcloud.py"
      - "backend/tests/test_pdal_service.py"
      - "backend/tests/test_pdal_processing_worker.py"
      - "backend/tests/test_photogrammetry_pointcloud.py"
      - "backend/tests/test_photogrammetry_pdal_pipeline.py"
      - "backend/tests/test_photogrammetry_pdal_ground.py"
      - "backend/tests/test_pointcloud.py"
      - "compose.yaml"
      - ".github/workflows/pdal-service.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pdal-service:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate PDAL Compose profiles
        run: docker compose --profile pdal --profile pdal-processing config >/dev/null

      - name: Build PDAL service
        run: docker build -f workers/pdal/Dockerfile -t geophoto-pdal:test .

      - name: Create point cloud fixture
        run: |
          mkdir -p data/ci
          cat > data/ci/fixture.ply <<'EOF'
          ply
          format ascii 1.0
          element vertex 4
          property float x
          property float y
          property float z
          end_header
          0 0 0
          1 0 1
          0 2 2
          2 2 3
          EOF

          cat > data/ci/geographic.csv <<'EOF'
          X,Y,Z
          8.5000,49.0000,100
          8.5001,49.0001,101
          8.5002,49.0002,102
          EOF

          cat > data/ci/make-source.json <<'EOF'
          {
            "pipeline": [
              {
                "type": "readers.text",
                "filename": "/data/ci/geographic.csv",
                "override_srs": "EPSG:4326"
              },
              {
                "type": "writers.las",
                "filename": "/data/ci/source.laz",
                "compression": true,
                "a_srs": "EPSG:4326",
                "scale_x": 0.0000001,
                "scale_y": 0.0000001,
                "scale_z": 0.001,
                "offset_x": "auto",
                "offset_y": "auto",
                "offset_z": "auto"
              }
            ]
          }
          EOF

          python3 - <<'PY'
          from pathlib import Path

          target = Path("data/ci/ground.csv")
          with target.open("w", encoding="utf-8") as handle:
              handle.write("X,Y,Z,ReturnNumber,NumberOfReturns,Classification\n")
              for ix in range(21):
                  for iy in range(21):
                      x = 500000.0 + ix
                      y = 5420000.0 + iy
                      z = 100.0 + ix * 0.01 + iy * 0.005
                      handle.write(f"{x},{y},{z},1,1,9\n")
              for ix, iy, height in (
                  (5.5, 5.5, 4.0),
                  (10.5, 10.5, 7.0),
                  (15.5, 15.5, 10.0),
              ):
                  x = 500000.0 + ix
                  y = 5420000.0 + iy
                  ground = 100.0 + ix * 0.01 + iy * 0.005
                  handle.write(f"{x},{y},{ground + height},1,1,9\n")
          PY

          cat > data/ci/make-ground-source.json <<'EOF'
          {
            "pipeline": [
              {
                "type": "readers.text",
                "filename": "/data/ci/ground.csv",
                "override_srs": "EPSG:32632"
              },
              {
                "type": "writers.las",
                "filename": "/data/ci/ground-source.laz",
                "compression": true,
                "minor_version": 4,
                "a_srs": "EPSG:32632",
                "scale_x": 0.001,
                "scale_y": 0.001,
                "scale_z": 0.001,
                "offset_x": "auto",
                "offset_y": "auto",
                "offset_z": "auto"
              }
            ]
          }
          EOF

          cat > data/ci/ground-hag.json <<'EOF'
          {
            "pipeline": [
              {
                "type": "readers.las",
                "filename": "/data/ci/ground-source.laz"
              },
              {
                "type": "filters.assign",
                "value": "Classification=0"
              },
              {
                "type": "filters.smrf",
                "cell": 1.0,
                "cut": 0.0,
                "returns": "last,only",
                "scalar": 1.25,
                "slope": 0.15,
                "threshold": 0.5,
                "window": 18.0,
                "ground_class": 2,
                "other_class": 1,
                "only_ground": false
              },
              {
                "type": "filters.hag_nn",
                "count": 1,
                "allow_extrapolation": false,
                "class": 2
              },
              {
                "type": "writers.las",
                "filename": "/data/ci/ground-hag.laz",
                "a_srs": "EPSG:32632",
                "compression": true,
                "minor_version": 4,
                "forward": "header,vlr",
                "extra_dims": "all",
                "scale_x": 0.001,
                "scale_y": 0.001,
                "scale_z": 0.001,
                "offset_x": "auto",
                "offset_y": "auto",
                "offset_z": "auto"
              }
            ]
          }
          EOF

          cat > data/ci/reproject.json <<'EOF'
          {
            "pipeline": [
              {
                "type": "readers.las",
                "filename": "/data/ci/source.laz"
              },
              {
                "type": "filters.reprojection",
                "in_srs": "EPSG:4326",
                "out_srs": "EPSG:32632"
              },
              {
                "type": "writers.las",
                "filename": "/data/ci/reprojected.laz",
                "a_srs": "EPSG:32632",
                "compression": true,
                "forward": "header,vlr",
                "extra_dims": "all",
                "scale_x": 0.001,
                "scale_y": 0.001,
                "scale_z": 0.001,
                "offset_x": "auto",
                "offset_y": "auto",
                "offset_z": "auto"
              }
            ]
          }
          EOF

      - name: Start PDAL service
        run: |
          docker run -d --rm             --name geophoto-pdal             -p 8090:8090             -v "$PWD/data:/data:ro"             geophoto-pdal:test

      - name: Wait for health
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8090/health; then
              exit 0
            fi
            sleep 2
          done
          docker logs geophoto-pdal
          exit 1

      - name: Verify PDAL version
        run: docker exec geophoto-pdal pdal --version | grep -q "2.10.2"

      - name: Verify processing worker runtime
        run: |
          docker run --rm \
            --entrypoint /opt/conda/envs/pdal/bin/python \
            geophoto-pdal:test \
            -c "import redis; assert redis.__version__ == '7.4.1'; import sys; sys.path.insert(0, '/worker'); import common.runtime"
          docker run --rm \
            --entrypoint timeout \
            geophoto-pdal:test \
            --version

      - name: Run real reprojection pipeline
        run: |
          docker run --rm \
            --entrypoint pdal \
            -v "$PWD/data:/data" \
            geophoto-pdal:test \
            pipeline /data/ci/make-source.json

          docker run --rm \
            --entrypoint pdal \
            -v "$PWD/data:/data" \
            geophoto-pdal:test \
            pipeline /data/ci/reproject.json

          docker run --rm \
            --entrypoint pdal \
            -v "$PWD/data:/data:ro" \
            geophoto-pdal:test \
            info --summary /data/ci/reprojected.laz \
            > /tmp/reproject-summary.json

          python3 - <<'PY'
          import json
          payload = json.load(open("/tmp/reproject-summary.json", encoding="utf-8"))
          summary = payload["summary"]
          assert summary["num_points"] == 3
          bounds = summary["bounds"]
          assert bounds["maxx"] > bounds["minx"] > 100000
          assert bounds["maxy"] > bounds["miny"] > 1000000
          srs = json.dumps(summary.get("srs", {}))
          assert "32632" in srs
          PY

      - name: Run real SMRF HAG pipeline
        run: |
          docker run --rm \
            --entrypoint pdal \
            -v "$PWD/data:/data" \
            geophoto-pdal:test \
            pipeline /data/ci/make-ground-source.json

          docker run --rm \
            --entrypoint pdal \
            -v "$PWD/data:/data" \
            geophoto-pdal:test \
            pipeline /data/ci/ground-hag.json

          docker run --rm \
            --entrypoint pdal \
            -v "$PWD/data:/data:ro" \
            geophoto-pdal:test \
            info --summary /data/ci/ground-hag.laz \
            > /tmp/ground-hag-summary.json

          docker run --rm \
            --entrypoint pdal \
            -v "$PWD/data:/data:ro" \
            geophoto-pdal:test \
            info --stats \
            --dimensions=Classification,HeightAboveGround \
            --enumerate=Classification \
            /data/ci/ground-hag.laz \
            > /tmp/ground-hag-stats.json

          python3 - <<'PY'
          import json

          summary = json.load(open("/tmp/ground-hag-summary.json", encoding="utf-8"))["summary"]
          assert summary["num_points"] == 444
          dimensions = summary["dimensions"]
          if isinstance(dimensions, str):
              dimensions = [part.strip() for part in dimensions.split(",") if part.strip()]
          names = {str(name).lower() for name in dimensions}
          assert "classification" in names
          assert "heightaboveground" in names
          assert "32632" in json.dumps(summary.get("srs", {}))

          payload = json.load(open("/tmp/ground-hag-stats.json", encoding="utf-8"))
          statistics = payload["stats"]["statistic"]
          by_name = {
              str(item.get("name", "")).lower(): item
              for item in statistics
              if isinstance(item, dict)
          }
          hag = by_name["heightaboveground"]
          assert float(hag["maximum"]) > 1.0
          assert float(hag["minimum"]) <= float(hag["maximum"])

          classification = by_name["classification"]
          counts = classification.get("counts", [])
          classes = {
              int(float(item["value"])): int(item["count"])
              for item in counts
              if isinstance(item, dict) and "value" in item and "count" in item
          }
          assert classes.get(2, 0) > 0
          assert classes.get(1, 0) > 0
          PY

      - name: Run real PLY QA
        run: |
          curl -fsS             -H 'Content-Type: application/json'             -d '{"relative_path":"ci/fixture.ply"}'             http://127.0.0.1:8090/qa             | tee /tmp/pdal-qa.json
          python3 - <<'PY'
          import json
          payload = json.load(open("/tmp/pdal-qa.json", encoding="utf-8"))
          assert payload["relative_path"] == "ci/fixture.ply"
          assert payload["summary"]["summary"]["num_points"] == 4
          dimensions = payload["summary"]["summary"]["dimensions"]
          if isinstance(dimensions, str):
              dimensions = [part.strip() for part in dimensions.split(",") if part.strip()]
          assert {"x", "y", "z"} <= {str(name).lower() for name in dimensions}
          statistics = payload["stats"]["stats"]["statistic"]
          assert {"x", "y", "z"} <= {
              str(item["name"]).lower()
              for item in statistics
              if isinstance(item, dict) and "name" in item
          }
          PY

      - name: Show logs
        if: always()
        run: docker logs geophoto-pdal || true

      - name: Stop PDAL service
        if: always()
        run: docker stop geophoto-pdal || true

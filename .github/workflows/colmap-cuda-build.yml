name: COLMAP CUDA Build

on:
  pull_request:
    paths:
      - "workers/gsplat/Dockerfile"
      - ".github/workflows/colmap-cuda-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  colmap-cuda-builder:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build COLMAP CUDA stage
        uses: docker/build-push-action@v6
        with:
          context: .
          file: workers/gsplat/Dockerfile
          target: colmap-builder
          platforms: linux/amd64
          push: false
          cache-from: type=gha,scope=colmap-cuda
          cache-to: type=gha,mode=max,scope=colmap-cuda

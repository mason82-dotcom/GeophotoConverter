name: geophoto-converter

services:
  web:
    build:
      context: ./frontend
    restart: unless-stopped
    ports:
      - "${GEOPHOTO_BIND_ADDRESS:-0.0.0.0}:${GEOPHOTO_WEB_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy

  api:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      GEOPHOTO_DATA_ROOT: /data
      GEOPHOTO_REDIS_URL: redis://redis:6379/0
      GEOPHOTO_MAX_FILE_MB: ${GEOPHOTO_MAX_FILE_MB:-500}
      GEOPHOTO_MAX_DATASET_GB: ${GEOPHOTO_MAX_DATASET_GB:-50}
    volumes:
      - ${GEOPHOTO_DATA_PATH:-./data}:/data
    ports:
      - "${GEOPHOTO_BIND_ADDRESS:-0.0.0.0}:${GEOPHOTO_HTTP_PORT:-8088}:8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/api/v1/health"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 5s
    depends_on:
      redis:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - geophoto-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

  odm-worker:
    build:
      context: .
      dockerfile: workers/odm/Dockerfile
    profiles: ["odm"]
    restart: unless-stopped
    environment:
      GEOPHOTO_DATA_ROOT: /data
      GEOPHOTO_REDIS_URL: redis://redis:6379/0
    volumes:
      - ${GEOPHOTO_DATA_PATH:-./data}:/data
    depends_on:
      redis:
        condition: service_healthy

  micmac-worker:
    build:
      context: .
      dockerfile: workers/micmac/Dockerfile
    profiles: ["micmac"]
    restart: unless-stopped
    environment:
      GEOPHOTO_DATA_ROOT: /data
      GEOPHOTO_REDIS_URL: redis://redis:6379/0
    volumes:
      - ${GEOPHOTO_DATA_PATH:-./data}:/data
    depends_on:
      redis:
        condition: service_healthy

  gsplat-worker:
    build:
      context: .
      dockerfile: workers/gsplat/Dockerfile
    profiles: ["gsplat"]
    restart: unless-stopped
    gpus: all
    environment:
      GEOPHOTO_DATA_ROOT: /data
      GEOPHOTO_REDIS_URL: redis://redis:6379/0
      TORCH_EXTENSIONS_DIR: /root/.cache/torch_extensions
    volumes:
      - ${GEOPHOTO_DATA_PATH:-./data}:/data
      - geophoto-gsplat-cache:/root/.cache/torch_extensions
    depends_on:
      redis:
        condition: service_healthy

  dronedb:
    image: dronedb/registry:latest
    profiles: ["dronedb"]
    restart: unless-stopped
    environment:
      INSTANCE_TYPE: "0"
      TMPDIR: /data/temp
      CPL_TMPDIR: /data/temp
      TEMP: /data/temp
    volumes:
      - geophoto-dronedb:/data
    ports:
      - "${GEOPHOTO_BIND_ADDRESS:-0.0.0.0}:${DRONEDB_PORT:-5000}:5000"

  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    profiles: ["ai"]
    restart: unless-stopped
    volumes:
      - geophoto-openwebui:/app/backend/data
    ports:
      - "${GEOPHOTO_BIND_ADDRESS:-0.0.0.0}:${OPENWEBUI_PORT:-3001}:8080"

volumes:
  geophoto-redis:
  geophoto-gsplat-cache:
  geophoto-dronedb:
  geophoto-openwebui:
